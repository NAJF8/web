name: Deploy AL ASAS static frontend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: alasas-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: alasas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, iconv
      - name: Seed temporary database
        run: |
          mysql -h 127.0.0.1 -u root -prootpass alasas < install/schema.sql
          mysql -h 127.0.0.1 -u root -prootpass alasas < app/migrations/2026_10_12_001_creative_studio.sql
      - name: Export PHP pages as static HTML and wire Supabase
        run: |
          cat > app/config.php <<'PHP'
          <?php
          defined('ALASAS') or exit;
          define('DB_HOST','127.0.0.1');
          define('DB_PORT',3306);
          define('DB_NAME','alasas');
          define('DB_USER','root');
          define('DB_PASS','rootpass');
          define('APP_KEY',base64_encode(str_repeat('x',32)));
          define('APP_DEBUG',true);
          PHP
          mkdir -p _site
          php index.php > _site/index.html
          php creative.php > _site/creative.html
          cp -R css js assets _site/
          python3 - <<'PY'
          import pathlib, json, re
          root=pathlib.Path('_site')
          api='https://nkzvxdobklsehdyzyzmy.supabase.co/functions/v1/alasas-web-api'
          for name in ['index.html','creative.html']:
              file=root/name
              s=file.read_text(encoding='utf-8')
              if len(s)<8000 or '<!doctype html>' not in s.lower(): raise SystemExit('Invalid HTML: '+name)
              s=s.replace('creative.php','creative.html').replace('index.php','index.html')
              s=s.replace('http://localhost./creative.html','https://najf8.github.io/web/creative.html')
              s=s.replace('http://localhost./','https://najf8.github.io/web/')
              def convert(m):
                  obj=json.loads(m.group(3))
                  if m.group(1)=='site-data':
                      obj['api']={'order':api+'/order','domain':api+'/domain','contact':api+'/contact'}
                  else:
                      obj['api']={'request':api+'/creative','portfolio':'portfolio.json'}
                  return m.group(2)+json.dumps(obj,ensure_ascii=False,separators=(',',':')).replace('</','<\\/')+m.group(4)
              s=re.sub(r'(<script id="(site-data|creative-data)" type="application/json">)(.*?)(</script>)',lambda m: convert_with_groups(m,api),s,flags=re.S) if False else s
              def patch(m):
                  obj=json.loads(m.group(3))
                  if m.group(2)=='site-data':
                      obj['api']={'order':api+'/order','domain':api+'/domain','contact':api+'/contact'}
                  else:
                      obj['api']={'request':api+'/creative','portfolio':'portfolio.json'}
                  return m.group(1)+json.dumps(obj,ensure_ascii=False,separators=(',',':')).replace('</','<\\/')+m.group(4)
              s=re.sub(r'(<script id="(site-data|creative-data)" type="application/json">)(.*?)(</script>)',patch,s,flags=re.S)
              s=re.sub(r'<input[^>]+type="file"[^>]*>', '', s)
              file.write_text(s,encoding='utf-8')
          (root/'portfolio.json').write_text(json.dumps({'ok':True,'items':[],'page':1,'pages':1,'total':0}),encoding='utf-8')
          PY
          rm -f app/config.php
          grep -q 'alasas-web-api/order' _site/index.html
          grep -q 'alasas-web-api/creative' _site/creative.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
